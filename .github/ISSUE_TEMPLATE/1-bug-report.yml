name: Bug Report
description: Report a problem with Kanagawa Paper
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Check the [documentation](https://github.com/thesimonho/kanagawa-paper) and
        [existing issues](https://github.com/thesimonho/kanagawa-paper/issues) first.
        Usage questions belong in [Discussions](https://github.com/thesimonho/kanagawa-paper/discussions).
  - type: input
    id: application
    attributes:
      label: Application
      description: Name the application or plugin this report concerns. List more than one if needed.
      placeholder: "Neovim, VS Code, Zed, Ghostty, or another application"
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      multiple: true
      options:
        - Ink
        - Canvas
        - Not theme-specific
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Versions and environment
      description: Include the application version, theme version or source commit, operating system, and installation method. For extras, include the application and configuration file. Name any related plugins or custom color overrides.
      placeholder: |
        Application and version:
        Theme version or source commit:
        Operating system:
        Installation method:
        Related plugins or overrides:
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the problem and include any error messages.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Give the smallest example that shows the problem. Include relevant configuration and sample text as fenced code blocks. For Neovim, include a minimal init.lua and the affected plugin setup when relevant.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: For a color or rendering problem, show the affected text and identify the selected theme.
    validations:
      required: false
