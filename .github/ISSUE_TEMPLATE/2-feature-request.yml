name: Feature Request
description: Suggest an improvement or a new target
title: "request: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [documentation](https://github.com/thesimonho/kanagawa-paper) and
        [existing issues](https://github.com/thesimonho/kanagawa-paper/issues) before submitting.
  - type: input
    id: application
    attributes:
      label: Application
      description: Name the application or plugin this request concerns. List more than one if needed.
      placeholder: "Neovim, VS Code, Zed, Ghostty, or another application"
    validations:
      required: true
  - type: dropdown
    id: theme
    attributes:
      label: Theme
      multiple: true
      options:
        - Ink
        - Canvas
        - Not theme-specific
    validations:
      required: true
  - type: input
    id: integration
    attributes:
      label: Application or plugin link
      description: For a new target, extra, or plugin integration, link to its project or theme documentation.
      placeholder: "https://"
    validations:
      required: false
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed behavior
      description: Describe the result you want. Include examples or screenshots when useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives or additional context
    validations:
      required: false
