name: Label Issues
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  label-issues:
    if: contains(github.event.issue.labels.*.name, 'bug') || contains(github.event.issue.labels.*.name, 'enhancement')
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    env:
      ISSUE_TEMPLATE: ${{ contains(github.event.issue.labels.*.name, 'bug') && '1-bug-report.yml' || '2-feature-request.yml' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Parse issue form
        uses: stefanbuck/github-issue-parser@v3
        id: issue-parser
        with:
          template-path: .github/ISSUE_TEMPLATE/${{ env.ISSUE_TEMPLATE }}
      - name: Set labels based on policy
        uses: redhat-plumbers-in-action/advanced-issue-labeler@v3
        with:
          issue-form: ${{ steps.issue-parser.outputs.jsonString }}
          template: ${{ env.ISSUE_TEMPLATE }}
          token: ${{ secrets.GITHUB_TOKEN }}
