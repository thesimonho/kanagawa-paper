name: Validate
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main, automation/release]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            scripts/release/package-lock.json
            package-lock.json
      - uses: ./.github/actions/generate
      - run: pip install -r scripts/release/requirements.txt
      - run: npm ci --prefix scripts/release --ignore-scripts
      - run: npm run typecheck
      - run: npm run format:check
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: v0.11.5
      - run: npm test
      - run: npm run test:release
      - run: bash scripts/test.sh
      - run: python -m unittest discover -s tests/release -p 'test_*.py'
      - run: python scripts/assemble.py
      - name: Package VS Code
        working-directory: dist/vscode
        run: ../../scripts/release/node_modules/.bin/vsce package --out ../vscode.vsix
      - name: Check release freshness
        if: github.head_ref == 'automation/release' || github.ref == 'refs/heads/automation/release'
        run: |
          git fetch origin main
          RELEASE_BASE_SHA=$(git rev-parse origin/main) python scripts/release/coordinator.py check-plan
      - name: Upload generated files for inspection
        uses: actions/upload-artifact@v4
        with:
          name: generated-theme-files
          path: |
            extras/
            palette_colors.md
            packages/neovim/doc/kanagawa-paper.nvim.txt
