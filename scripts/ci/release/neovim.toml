[semantic_release]
commit_parser = "conventional-monorepo"
tag_format = "neovim-source-{version}"
version_variables = ["packages/neovim/version.txt:VERSION"]
allow_zero_version = false

[semantic_release.branches.main]
match = "main"

[semantic_release.commit_parser_options]
path_filters = ["packages/neovim/**", "shared/**", "README.md", "LICENSE", "scripts/*.ts", "scripts/assemble.py", "package.json", "package-lock.json", "tsconfig.json", "scripts/ci/release/**"]

[semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ["^chore\\(release\\):"]

[semantic_release.changelog.default_templates]
changelog_file = "packages/neovim/CHANGELOG.md"
