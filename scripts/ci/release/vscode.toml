[semantic_release]
commit_parser = "conventional-monorepo"
tag_format = "vscode-source-{version}"
version_variables = ["packages/vscode/package.json:version"]
allow_zero_version = false

[semantic_release.branches.main]
match = "main"

[semantic_release.commit_parser_options]
path_filters = ["packages/vscode/**", "shared/**", "README.md", "LICENSE", "scripts/*.ts", "scripts/build/**", "package.json", "package-lock.json", "tsconfig.json", "scripts/ci/release/**"]

[semantic_release.changelog]
mode = "update"
exclude_commit_patterns = ["^chore\\(release\\):"]

[semantic_release.changelog.default_templates]
changelog_file = "packages/vscode/CHANGELOG.md"
